# CI for the API (part 1: model + API). Runs on every push and pull request:
# lint (ruff) -> tests (pytest) -> build the image -> smoke test -> publish to GHCR (push to main only).
# No secret is used: GHCR is written with the automatic GITHUB_TOKEN.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_VERSION: "1.0.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install
        run: pip install -r api/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check api model
      - name: Tests (pytest)
        run: pytest api/tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR needs lowercase)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build (multi-stage, from the repo root)
        run: |
          docker build -f api/Dockerfile \
            --build-arg GIT_SHA=${{ steps.meta.outputs.sha }} \
            --build-arg API_VERSION=${{ env.API_VERSION }} \
            -t ${{ steps.meta.outputs.image }}:${{ env.API_VERSION }} \
            -t ${{ steps.meta.outputs.image }}:${{ github.sha }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }} .
          docker image ls ${{ steps.meta.outputs.image }}
      - name: Check size < 500 MB
        run: |
          size=$(docker image inspect ${{ steps.meta.outputs.image }}:${{ github.sha }} --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt 524288000
      - name: Smoke test (container health, /version, /predict, non-root user)
        run: |
          docker run -d --name api -p 8000:8000 ${{ steps.meta.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          echo; curl -fs localhost:8000/version; echo
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d @samples/predict_request.json; echo
          test "$(docker exec api id -u)" != "0"
          sleep 35; docker inspect --format '{{.State.Health.Status}}' api
          docker rm -f api
      # Only main publishes the image used by Container Apps. If GHCR answers "denied", the repo owner sets
      # Settings > Actions > General > Workflow permissions to "Read and write" (packages: write is requested above).
      - name: Publish to GHCR (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push --all-tags ${{ steps.meta.outputs.image }}
